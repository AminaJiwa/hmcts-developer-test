<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager HMCTS Caseworker System</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Task Manager</h1>
            <p>Manage your HMCTS casework tasks efficiently</p>
        </div>

        <!-- Create Task Form -->
        <div class="form-card">
            <div class="form-title">Create New Task</div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" required placeholder="Enter task title">
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" name="description" placeholder="Enter task description"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" name="status" required>
                            <option value="PENDING">Pending</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="COMPLETED">Completed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dueDateTime">Due Date/Time *</label>
                        <input type="datetime-local" id="dueDateTime" name="dueDateTime" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Create Task</button>
            </form>
            <div id="formMessage" class="message"></div>
        </div>

        <!-- Tasks List -->
        <div class="tasks-card">
            <div class="tasks-header">
                <div class="tasks-title">My Tasks</div>
                <button class="refresh-btn" onclick="loadTasks()">Refresh</button>
            </div>
            <div id="tasksList">
                <div class="empty-state">Loading tasks...</div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
